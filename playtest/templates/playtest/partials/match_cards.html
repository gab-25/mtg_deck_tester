{% if matches %}
<div class="deck-grid">
    {% for match in matches %}
    <a href="{% url 'match_detail' match.id %}" class="deck-card">
        <div class="pt-[17px] px-[18px] pb-4">
            <div class="flex items-start justify-between gap-2.5 mb-3">
                <div class="font-cinzel font-semibold text-[17px] leading-[1.2]">{{ match.get_format_display }}</div>
                {% include "playtest/partials/match_status.html" with match=match %}
            </div>
            <div class="flex flex-col gap-1.5 mb-4">
                {% for seat in match.seats.all %}
                <div class="flex items-center gap-2 text-[13px]">
                    <span translate="no" class="ms text-[16px] {% if match.winner_id == seat.id %}text-gold{% endif %}
