{% comment %}
Confirmation modal in pure CSS: a hidden checkbox opens it (its <label> is
the trigger), the backdrop and Cancel uncheck it, Confirm POSTs to `action`.
The wrapper scopes the `~` selector so two modals on a page stay apart.

Params:
  id            unique id for the checkbox/labels (must be unique per page)
  action        URL the confirm button POSTs to
  message       confirmation prompt shown in the modal
  trigger_label text for the button that opens the modal (optional, icon-only if omitted)
  trigger_icon  Material Symbols name for the trigger (optional)
  trigger_title accessible name for an icon-only trigger (optional)
  trigger_class CSS classes for the trigger button (default: btn btn-danger)
  confirm_label text for the confirm button (default: Confirm)
  danger        truthy to make the confirm button the danger one
{% endcomment %}
<div class="modal-root">
    {# Focusable on purpose: Space on the checkbox opens the modal from the keyboard. #}
    <input type="checkbox" id="{{ id }}" class="modal-toggle" aria-haspopup="dialog" {% if trigger_title %}aria-label="{{ trigger_title }}"{% elif trigger_label %}aria-label="{{ trigger_label }}"{% endif %} />
    <label for="{{ id }}" class="{{ trigger_class|default:'btn btn-danger' }}"
        {% if trigger_title %}title="{{ trigger_title }}" aria-label="{{ trigger_title }}"{% endif %}>
        {% if trigger_icon %}<span translate="no" class="ms ms-sm">{{ trigger_icon }}</span>{% endif %}
        {% if trigger_label %}{{ trigger_label }}{% endif %}
    </label>
    <div class="modal-backdrop">
        <label for="{{ id }}" class="modal-dismiss" aria-hidden="true"></label>
        <div class="modal" role="dialog" aria-modal="true">
            <p class="modal-text">{{ message }}</p>
            <div class="modal-actions">
                <label for="{{ id }}" class="btn btn-line">Cancel</label>
                <form method="post" action="{{ action }}">
                    {% csrf_token %}
                    <button type="submit" class="btn {% if danger %}btn-danger-solid{% else %}btn-primary{% endif %}">
                        {{ confirm_label|default:'Confirm' }}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
