{% comment %}
The sidebar's Forge bridge row. The page renders it without a status, and it
loads its own at once (/engine/forge); the loaded row polls every 30s.
{% endcomment %}
<div class="engine-row" title="{{ forge_url }}" hx-get="{% url 'forge_status' %}" hx-trigger="{% if status %}every 30s{% else %}load{% endif %}" hx-swap="outerHTML">
    <span class="dot {{ dot|default:'muted' }}" aria-hidden="true"></span>Forge bridge<span class="engine-value {{ dot|default:'muted' }}">{{ status|default:"checking" }}</span>
</div>
