{% comment %}
Everything wrong with a submitted form at once, so it can be fixed in one pass.
{% endcomment %}
{% if errors %}
<div class="alert alert-error" role="alert">
    <span translate="no" class="ms ms-sm">error</span>
    <div class="alert-body">
        <strong>{{ errors_title|default:'This can’t be saved yet' }}</strong>
        <ul class="alert-list">
            {% for error in errors %}<li>{{ error }}</li>{% endfor %}
        </ul>
    </div>
</div>
{% endif %}
