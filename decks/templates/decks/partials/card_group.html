{% comment %}
One group of card rows on the deck page. Include with `group` in scope.
{% endcomment %}
<section class="panel">
    <div class="panel-head">
        <span class="dot" style="background:{{ group.hex }}" aria-hidden="true"></span>
        <span class="panel-title">{{ group.label }}</span>
        <span class="panel-sub num">{{ group.count }}</span>
    </div>
    {% for c in group.cards %}
    <button type="button" class="card-row"
        {% if c.image_query %}hx-get="{% url 'card_image_modal' %}?{{ c.image_query }}" hx-target="#card-image-modal-container" hx-swap="innerHTML"{% endif %}
        title="{% if c.oracle %}{{ c.oracle }}{% else %}View card{% endif %}">
        <span class="card-qty">{{ c.quantity }}</span>
        <span class="card-thumb">{% if c.image %}<img src="{{ c.image }}" alt="" loading="lazy" />{% endif %}</span>
        <span translate="no" class="card-name">{{ c.name }}</span>
        {% if c.is_commander %}<span class="chip">Commander</span>{% endif %}
        <span class="card-type" style="color:{{ c.type_hex }}">{{ c.type }} · {{ c.mv }}</span>
    </button>
    {% endfor %}
</section>
