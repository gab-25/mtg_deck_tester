{% extends "base.html" %}

{% block title %}Decks — MTG Gauntlet{% endblock %}

{% block content %}
<div class="page" data-screen-label="Decks">
    <div class="flex items-end justify-between gap-5 flex-wrap mb-6">
        <div>
            <div class="kicker">Collection</div>
            <h1 class="font-cinzel font-semibold text-[34px] mt-[7px] mb-1.5 tracking-[.03em]">Your Decks</h1>
            <p class="m-0 text-txt2 font-light text-[14.5px]">
                {{ decks|length }} deck{{ decks|length|pluralize }} ready to be played by the AI
            </p>
        </div>
        <a href="{% url 'new_deck' %}" class="btn btn-grad">
            <span translate="no" class="ms text-[20px]">add</span>Import deck
        </a>
    </div>

    {% include "decks/partials/deck_grid.html" %}
</div>
{% endblock %}
